name: dbt CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  dbt-prod-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake

      - name: Write profiles.yml (prod target)
        run: |
          mkdir -p ~/.dbt
          echo "my_first_project:" > ~/.dbt/profiles.yml
          echo "  target: prod" >> ~/.dbt/profiles.yml
          echo "  outputs:" >> ~/.dbt/profiles.yml
          echo "    prod:" >> ~/.dbt/profiles.yml
          echo "      type: snowflake" >> ~/.dbt/profiles.yml
          echo "      account: ${SNOWFLAKE_ACCOUNT}" >> ~/.dbt/profiles.yml
          echo "      user: ${SNOWFLAKE_USER}" >> ~/.dbt/profiles.yml
          echo "      password: ${SNOWFLAKE_PASSWORD}" >> ~/.dbt/profiles.yml
          echo "      role: ACCOUNTADMIN" >> ~/.dbt/profiles.yml
          echo "      database: dbt_hui" >> ~/.dbt/profiles.yml
          echo "      warehouse: COMPUTE_WH" >> ~/.dbt/profiles.yml
          echo "      schema: dbt_hui" >> ~/.dbt/profiles.yml
          echo "      threads: 4" >> ~/.dbt/profiles.yml
      - name: Check secret lengths
        run: |
          echo "Account length: ${#SNOWFLAKE_ACCOUNT}"
          echo "User length: ${#SNOWFLAKE_USER}"
          echo "Password length: ${#SNOWFLAKE_PASSWORD}"

      - name: Install dbt packages
        run: dbt deps

      - name: Run dbt (full, prod)
        run: dbt run

      - name: Test dbt
        run: dbt test

      - name: Save manifest for Slim CI
        uses: actions/cache/save@v4
        with:
          path: target/manifest.json
          key: dbt-manifest-${{ github.sha }}

  dbt-slim-ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake

      - name: Write profiles.yml (dev/CI target)
        run: |
          mkdir -p ~/.dbt
          echo "my_first_project:" > ~/.dbt/profiles.yml
          echo "  target: dev" >> ~/.dbt/profiles.yml
          echo "  outputs:" >> ~/.dbt/profiles.yml
          echo "    dev:" >> ~/.dbt/profiles.yml
          echo "      type: snowflake" >> ~/.dbt/profiles.yml
          echo "      account: ${SNOWFLAKE_ACCOUNT}" >> ~/.dbt/profiles.yml
          echo "      user: ${SNOWFLAKE_USER}" >> ~/.dbt/profiles.yml
          echo "      password: ${SNOWFLAKE_PASSWORD}" >> ~/.dbt/profiles.yml
          echo "      role: ACCOUNTADMIN" >> ~/.dbt/profiles.yml
          echo "      database: dbt_hui" >> ~/.dbt/profiles.yml
          echo "      warehouse: COMPUTE_WH" >> ~/.dbt/profiles.yml
          echo "      schema: dbt_ci" >> ~/.dbt/profiles.yml
          echo "      threads: 4" >> ~/.dbt/profiles.yml

      - name: Install dbt packages
        run: dbt deps

      - name: Restore last prod manifest
        uses: actions/cache/restore@v4
        with:
          path: state/manifest.json
          key: dbt-manifest-
          restore-keys: |
            dbt-manifest-

      - name: Run dbt (Slim CI if manifest found, full run otherwise)
        run: |
          if [ -f state/manifest.json ]; then
            echo "Manifest found — running Slim CI (state:modified+)"
            dbt run --select state:modified+ --state ./state
          else
            echo "No manifest yet — running full build"
            dbt run
          fi

      - name: Test dbt
        run: |
          if [ -f state/manifest.json ]; then
            dbt test --select state:modified+ --state ./state
          else
            dbt test
          fi
