version: 2

models:
  - name: dim_customers
    description: "One row per customer with lifetime order metrics"
    columns:
      - name: customer_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: number_of_orders
        description: "Total number of orders placed by this customer"
      - name: lifetime_value_dollars
        description: "Total spend in dollars across all orders"

  - name: fct_orders
    description: "One row per order — incremental model updated daily"
    columns:
      - name: order_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to dim_customers"
        tests:
          - not_null
      - name: status
        description: "Order status"
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
